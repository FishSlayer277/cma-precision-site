[build]
  publish = "."
  functions = "netlify/functions"

# Artwork and icon rarely change: let browsers keep them for 30 days
[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
